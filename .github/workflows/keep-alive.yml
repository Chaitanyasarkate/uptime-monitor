# .github/workflows/keep-alive.yml
name: Keep Uptime Monitor Awake
on:
  schedule:
    - cron: '*/14 * * * *' # Runs every 14 minutes
  workflow_dispatch:       # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          URL="${{ secrets.BACKEND_URL || 'https://uptime-monitor-39c5.onrender.com/api/health' }}"
          echo "Pinging: $URL"
          curl -f --max-time 30 --retry 2 "$URL"

