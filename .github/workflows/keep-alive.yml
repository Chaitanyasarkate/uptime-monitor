# .github/workflows/keep-alive.yml
name: Keep Uptime Monitor Awake
on:
  schedule:
    - cron: '*/14 * * * *' # Runs every 14 minutes
  workflow_dispatch:       # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://uptime-monitor-39c5.onrender.com/api/health' }}
        run: |
          set -euo pipefail

          if [[ ! "$BACKEND_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::BACKEND_URL must be a valid HTTPS URL without whitespace. Got: '$BACKEND_URL'"
            exit 1
          fi

          echo "Pinging backend health endpoint"
          curl --fail --silent --show-error \
            --location \
            --max-time 30 \
            --retry 8 \
            --retry-delay 10 \
            --retry-max-time 180 \
            --retry-all-errors \
            "$BACKEND_URL"
